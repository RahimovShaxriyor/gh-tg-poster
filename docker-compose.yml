# Продакшен: один экземпляр, SQLite в ./data, Caddy с HTTPS.
# Личные данные живут вне образа и вне git: .env, ./data (база), ./backups, том caddy_data (сертификаты).
# Обновление (deploy/deploy.sh) пересобирает только образ приложения; эти данные не трогает.
# Не запускайте `docker compose down -v`: флаг -v удалит том с сертификатами Caddy.
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # Тег образа: deploy.sh перед сборкой сохраняет прежний как gh-tg-web:previous для отката
    image: gh-tg-web:current
    restart: unless-stopped
    env_file: .env
    # Пользователь контейнера = владелец ./data на хосте (по умолчанию 1000, на сервере — пользователь deploy).
    # Права: sudo chown -R "$(id -u deploy):$(id -g deploy)" data backups
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data:/app/data
    # Корень контейнера только для чтения: приложение пишет лишь в /app/data и /tmp
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 200
    # Время на корректную остановку: сервер дожидается текущей отправки или генерации
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    # Caddy нужен только домен, пароли и ключи из .env ему не передаются
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
